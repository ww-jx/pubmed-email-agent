name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
      UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set All Function Secrets
        run: |
          supabase secrets set --project-ref $SUPABASE_PROJECT_REF \
            FEEDBACK_BASE_URL=$FEEDBACK_BASE_URL \
            UNSUBSCRIBE_BASE_URL=$UNSUBSCRIBE_BASE_URL

      - name: Deploy 'record-feedback' Function
        run: supabase functions deploy record-feedback --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt

      - name: Deploy 'unsubscribe-user' Function
        run: supabase functions deploy unsubscribe-user --project-ref $SUPABASE_PROJECT_REF --no-verify-jwt
