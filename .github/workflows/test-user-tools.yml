name: User Tools Tests

on:
  push:
    paths:
      - '.github/workflows/test-user-tools.yml'
      - 'src/pubmed_email_agent/tools/user/**'
      - 'tests/test_user_tools.py'
  pull_request:
    paths:
      - '.github/workflows/test-user-tools.yml'
      - 'src/pubmed_email_agent/tools/user/**'
      - 'tests/test_user_tools.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Database
        run: supabase start

      - name: Run User Tests
        run: uv run pytest tests/test_user_tools.py -v
