name: PubMed API Tools Tests

on:
  push:
    paths:
      - '.github/workflows/test-pubmed-tools.yml'
      - 'src/pubmed_email_agent/tools/pubmed/**'
      - 'tests/test_pubmed_tools.py'
      - 'tests/api_models.py'
  pull_request:
    paths:
      - '.github/workflows/test-pubmed-tools.yml'
      - 'src/pubmed_email_agent/tools/pubmed/**'
      - 'tests/test_pubmed_tools.py'
      - 'tests/api_models.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run PubMed API Tests
        run: uv run pytest tests/test_pubmed_tools.py -v
