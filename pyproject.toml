[project]
name = "pubmed-email-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30.0",
  "langchain>=0.3.27",
  "langchain-openai>=0.3.33",
  "langgraph>=0.6.7",
  "langsmith>=0.4.28",
  "markdown2>=2.5.4",
  "openrouter>=0.9.1",
  "pubmedclient @ git+https://github.com/xyberii4/pubmedclient.git@feature/elink",
  "python-dotenv>=1.1.1",
  "sendgrid>=6.12.5",
  "sqlalchemy[asyncio]>=2.0.43",
  "xmltodict>=1.0.2",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
